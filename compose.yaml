services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                LOCAL_UID: ${LOCAL_UID:-1000}
                LOCAL_GID: ${LOCAL_GID:-1000}
        volumes:
            - .:/var/www/html
        depends_on:
            postgres:
                condition: service_healthy

    nginx:
        image: nginx:1.28-alpine
        ports:
            - "127.0.0.1:${HTTP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-rie}
            POSTGRES_USER: ${DB_USERNAME:-rie}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        command: [ "postgres", "-c", "timezone=UTC" ]
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    postgres-test:
        image: postgres:18-alpine
        profiles: [ "test" ]
        environment:
            POSTGRES_DB: rie_test
            POSTGRES_USER: rie_test
            POSTGRES_PASSWORD: rie-test-only
        command: [ "postgres", "-c", "timezone=UTC" ]
        volumes:
            - postgres-test-data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres-data:
    postgres-test-data:
